<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An immersive field of blue flowers swaying beneath drifting cherry blossoms." />
    <meta name="theme-color" content="#dca3ae" />
    <title>Blue Bloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Italiana&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-label="Blue flowers swaying beneath cherry blossoms">
      <div class="backdrop" aria-hidden="true"></div>
      <div class="light-wash" aria-hidden="true"></div>
      <div class="petals petals-back" aria-hidden="true"></div>
      <section class="intro">
        <p class="eyebrow">A quiet moment in bloom</p>
        <h1>Blue<br /><em>Bloom</em></h1>
        <p class="invitation">Move through the garden and let the breeze follow.</p>
      </section>
      <div class="flower-field flower-field-back" aria-hidden="true"><img src="assets/blue-flowers.webp" alt="" /></div>
      <div class="flower-field flower-field-front" aria-hidden="true"><img src="assets/blue-flowers.webp" alt="" /></div>
      <div class="petals petals-front" aria-hidden="true"></div>
      <div class="wind-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
